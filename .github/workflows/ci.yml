name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      # Test seed Dehavi cần PostGIS thật; test khác chạy trên SQLite trong bộ nhớ.
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: dehavi_seed_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dehavi_seed_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DEHAVI_SEED_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/dehavi_seed_test
      DEHAVI_ISOLATED_POSTGIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  data:
    name: Dữ liệu gốc (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q tests/data

  frontend:
    name: Frontend (type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  database:
    name: Database khớp repo (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: schema.sql + seed + migration 014 (chạy 2 lần) + tools/kiem-tra-database.sql phải rỗng
        run: scripts/ci/kiem-tra-database.sh

  docs:
    name: Tài liệu API sinh lại không đổi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Sinh lại docs/API.md và Postman
        working-directory: backend
        run: python ../tools/sinh_tai_lieu_api.py
      - name: Không được lệch so với bản đã commit
        run: git diff --exit-code -- docs/API.md docs/postman

  docker:
    name: Build image chạy thật và kiểm tra cấu hình
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra docker-compose.prod.yml
        run: |
          cp .env.production.example .env.production
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=ci-only-secret-key-0123456789-abcdef/' .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config -q
      - name: Kiểm tra cấu hình Nginx
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/frontend/nginx/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro" \
            -v "$PWD/frontend/nginx/security_headers.inc:/etc/nginx/conf.d/security_headers.inc:ro" \
            nginx:1.27-alpine nginx -t
      - name: Build image
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build
      - name: Chạy thử toàn bộ hệ thống (database trống, chưa có dữ liệu)
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1/healthz >/dev/null && curl -fsS http://127.0.0.1/api/v1/products >/dev/null && break
            sleep 4
          done
          curl -fsS http://127.0.0.1/api/v1/products
          curl -fsS http://127.0.0.1/robots.txt | grep -q "Sitemap:"
          curl -fsS http://127.0.0.1/sitemap.xml | grep -q "<urlset"
          curl -fsS -A "facebookexternalhit/1.1" http://127.0.0.1/ | grep -q 'property="og:title"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/docs)" = "404"
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=80
