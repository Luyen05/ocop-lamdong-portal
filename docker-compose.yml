services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lamdong-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed_dev.sql:/docker-entrypoint-initdb.d/002-seed-dev.sql:ro
      - ./database/seed_tourism_locations.sql:/docker-entrypoint-initdb.d/003-seed-tourism-locations.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: lamdong-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}"

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: lamdong-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      UPLOAD_DIRECTORY: /app/uploads
      NEWS_RSS_URL: ${NEWS_RSS_URL:-https://ocoplamdong.gov.vn/rssChanel/tin-tuc-su-kien.rss}
      NEWS_RSS_TIMEOUT_SECONDS: ${NEWS_RSS_TIMEOUT_SECONDS:-8}
      NEWS_RSS_MAX_BYTES: ${NEWS_RSS_MAX_BYTES:-1048576}
      NEWS_CACHE_TTL_SECONDS: ${NEWS_CACHE_TTL_SECONDS:-900}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT_SECONDS: ${OSRM_TIMEOUT_SECONDS:-8}

    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - backend_uploads:/app/uploads

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: lamdong-frontend
    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    # Dong bo thu vien vao volume khi package.json/package-lock.json thay doi.
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  frontend_node_modules:
  backend_uploads:
