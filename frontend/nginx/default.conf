# Nginx của bản chạy thật (frontend/Dockerfile.prod): phục vụ bản build Vue, chuyển /api/ về backend.
# Backend là service "backend" trong docker-compose.prod.yml.

# Bot chia sẻ không chạy JavaScript nên nhận HTML tĩnh có og:* từ backend (backend/app/api/routes/seo.py).
# Googlebot chạy JavaScript nên đọc thẳng bản Vue.
map $http_user_agent $share_bot {
    default 0;
    ~*(facebookexternalhit|facebot|zalo|zaloapp|twitterbot|slackbot|telegrambot|linkedinbot|whatsapp|discordbot) 1;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Giới hạn tần suất đăng nhập (bổ sung cho bộ đếm trong ứng dụng, vì backend chạy nhiều tiến trình).
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

upstream backend_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh 5 MB, giấy chứng nhận 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # add_header ở cấp server bị bỏ qua trong location có add_header riêng, nên nạp từ tệp dùng chung.
    include /etc/nginx/conf.d/security_headers.inc;

    # Kiểm tra sức khỏe cho Docker/bộ cân bằng tải.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ----- Backend -----
    location /api/ {
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Tài liệu API (Swagger) chỉ dành cho nhà phát triển: không công khai trên máy chủ thật.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy_params.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/conf.d/security_headers.inc;
    }

    location = /robots.txt {
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /sitemap.xml {
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # ----- Trang chia sẻ cho bot -----
    location = / {
        if ($share_bot) { rewrite ^ /__share/ last; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security_headers.inc;
    }

    location ~ ^/(san-pham|diem-du-lich)/[^/]+/?$ {
        if ($share_bot) { rewrite ^ /__share$uri last; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security_headers.inc;
    }

    location /__share/ {
        internal;
        rewrite ^/__share(/.*)$ $1 break;
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # ----- Bản build Vue -----
    # Tệp trong /assets/ do Vite băm tên (đổi nội dung thì đổi tên) nên cache lâu được.
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    # Ảnh và tài nguyên tĩnh không băm tên.
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    # Vue Router (history mode): mọi đường dẫn khác trả index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security_headers.inc;
    }
}
